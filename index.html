<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev.ZJY | 数字化整备间</title>
    <style>
        :root {
            --bg-color: #020204;
            --main-text: #ced4da;
            --title-white: #e9ecef;
            --sub-text: #6c757d;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #00f2fe;
            --danger-red: #ff7875;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', 'PingFang SC', monospace; cursor: default; }
        body { background-color: var(--bg-color); color: var(--main-text); line-height: 1.6; overflow-x: hidden; }

        .header-strip { height: 260px; width: 100%; position: relative; overflow: hidden; display: flex; align-items: flex-start; border-bottom: 1px solid var(--border-color); background: radial-gradient(circle at center, #100a1f 0%, var(--bg-color) 85%); }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .header-content { position: relative; z-index: 10; padding: 60px 0 0 7vw; pointer-events: none; }
        .name { font-size: 1.8rem; font-weight: 300; letter-spacing: 6px; color: var(--title-white); text-shadow: 0 0 20px rgba(0, 242, 254, 0.2); }
        .role { font-size: 0.7rem; color: var(--sub-text); letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; display: block; }

        .main-content { padding: 40px 7vw; max-width: 900px; margin: 0 auto; min-height: 80vh; }
        .section-header { margin: 60px 0 25px; display: flex; align-items: center; gap: 20px; }
        .section-header h2 { font-size: 0.85rem; letter-spacing: 3px; color: var(--sub-text); font-weight: 500; text-transform: uppercase; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: var(--border-color); }

        .article-row, .file-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 18px 25px; background: rgba(255, 255, 255, 0.02); 
            border: 1px solid var(--border-color); border-radius: 4px; 
            transition: all 0.3s ease; text-decoration: none; color: inherit; margin-bottom: 12px;
        }
        .article-row:hover, .file-row:hover { 
            border-color: rgba(0, 242, 254, 0.3); 
            background: rgba(255, 255, 255, 0.04); 
            transform: translateX(4px); 
        }
        .article-title, .file-name { font-size: 0.95rem; color: var(--title-white); }
        .date-tag { font-size: 0.75rem; color: var(--sub-text); }

        .file-actions { display: flex; gap: 18px; }
        .action-link { 
            font-size: 0.7rem; color: var(--sub-text); text-decoration: none; 
            letter-spacing: 1px; cursor: pointer; border-bottom: 1px solid transparent; transition: 0.2s; 
        }
        .action-link:hover { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

        footer { padding: 100px 0 50px; text-align: center; font-size: 0.65rem; color: var(--sub-text); letter-spacing: 2px; opacity: 0.6; }
    </style>
</head>
<body>

    <header class="header-strip">
        <canvas id="particle-canvas"></canvas>
        <div class="header-content">
            <h1 class="name">Z.J.Y</h1>
            <span class="role">Mechanical & Automation Engineer</span>
        </div>
    </header>

    <main class="main-content">
        <div class="section-header"><h2>/ REPOSITORY</h2></div>
        <div id="article-list"></div>

        <div class="section-header"><h2>/ TRANSFER_STATION</h2></div>
        <div id="file-container"></div>
    </main>

    <footer><p>DATA DRIVEN BY JSON // SYSTEM_STATUS: OPERATIONAL</p></footer>

    <script>
        /* --- 1. 数据加载逻辑 --- */
        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                // 渲染文章
                const articleList = document.getElementById('article-list');
                articleList.innerHTML = data.articles.map(art => `
                    <a href="${art.url}" class="article-row">
                        <span class="article-title">${art.title}</span>
                        <span class="date-tag">${art.date}</span>
                    </a>
                `).join('');

                // 渲染文件
                const fileContainer = document.getElementById('file-container');
                fileContainer.innerHTML = data.files.map(file => `
                    <div class="file-row">
                        <div class="file-info"><span class="file-name">${file.name}</span></div>
                        <div class="file-actions">
                            <span class="action-link" onclick="alert('链接已复制')">SHARE</span>
                            <span class="action-link" onclick="alert('准备下载')">DOWNLOAD</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载失败:', error);
            }
        }
        window.onload = () => { loadData(); anim(); };

        /* --- 2. 黑洞引力特效 (回归版) --- */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const header = document.querySelector('.header-strip');
        let mouse = { x: null, y: null, active: false };
        header.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top; mouse.active = true;
        });
        header.addEventListener('mouseleave', () => { mouse.active = false; });
        function resize() { canvas.width = header.clientWidth; canvas.height = header.clientHeight; }
        window.addEventListener('resize', resize); resize();

        let particles = [];
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
                this.size = Math.random() * 1.3; this.life = Math.random() * 200 + 100;
                this.maxLife = this.life;
            }
            update() {
                if (mouse.active) {
                    const dx = this.x - mouse.x; const dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 250) {
                        const force = (250 - dist) / 250; const angle = Math.atan2(dy, dx);
                        this.vx -= Math.cos(angle) * force * 0.5; this.vy -= Math.sin(angle) * force * 0.5;
                    }
                }
                this.vx *= 0.97; this.vy *= 0.97;
                this.x += this.vx; this.y += this.vy;
                this.life--; if(this.life <= 0) this.reset();
            }
            draw() {
                const opacity = (this.life / this.maxLife) * 0.5;
                ctx.fillStyle = `rgba(206, 212, 218, ${opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }
        for(let i=0; i<200; i++) particles.push(new Particle());
        function anim() {
            ctx.fillStyle = 'rgba(2, 2, 4, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(anim);
        }
    </script>
</body>
</html>
