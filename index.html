<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev.ZJY | 数字化整备间</title>
    <style>
        :root {
            --bg-color: #020204;
            --main-text: rgba(224, 230, 237, 0.95);
            --sub-text: rgba(136, 136, 136, 0.5);
            --border-color: rgba(255, 255, 255, 0.04);
            --star-white: #ffffff;
            --accent-blue: #00f2fe;
            --danger-red: #ff4d4f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', 'PingFang SC', monospace; cursor: default; }
        body { background-color: var(--bg-color); color: var(--main-text); line-height: 1.6; overflow-x: hidden; }

        /* --- 头部星空 --- */
        .header-strip { height: 260px; width: 100%; position: relative; overflow: hidden; display: flex; align-items: flex-start; border-bottom: 1px solid var(--border-color); background: radial-gradient(circle at center, #1a0f2e 0%, var(--bg-color) 70%); }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .header-content { position: relative; z-index: 10; padding: 50px 0 0 7vw; pointer-events: none; }
        .name { font-size: 2rem; font-weight: 300; letter-spacing: 8px; color: var(--star-white); text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
        .role { font-size: 0.75rem; color: rgba(255, 255, 255, 0.4); letter-spacing: 3px; text-transform: uppercase; }

        /* --- 主体 --- */
        .main-content { padding: 40px 7vw; max-width: 1000px; margin: 0 auto; min-height: 80vh; }
        .section-header { margin: 50px 0 25px; display: flex; align-items: center; gap: 20px; }
        .section-header h2 { font-size: 0.9rem; letter-spacing: 4px; color: var(--sub-text); font-weight: 400; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: var(--border-color); }

        /* --- 文章列表 --- */
        .item-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 60px; }
        .article-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 25px; background: rgba(255, 255, 255, 0.01); border: 1px solid var(--border-color); border-radius: 4px; transition: 0.3s; text-decoration: none; color: inherit; }
        .article-row:hover { border-color: rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.02); transform: translateX(5px); }
        .article-title { font-size: 1rem; font-weight: 400; color: #fff; }

        /* --- 文件列表 --- */
        .file-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 1px solid var(--border-color); background: rgba(255, 255, 255, 0.005); transition: 0.3s; }
        .file-row:hover { background: rgba(255, 255, 255, 0.015); }
        .file-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .file-icon { opacity: 0.3; font-size: 0.8rem; }
        .file-name { font-size: 0.9rem; color: var(--main-text); }

        .file-actions { display: flex; gap: 20px; }
        .action-link { font-size: 0.7rem; color: var(--sub-text); text-decoration: none; letter-spacing: 1px; cursor: pointer; border-bottom: 1px solid transparent; transition: 0.2s; }
        .action-link:hover { color: #fff; border-bottom: 1px solid #fff; }
        .action-link.delete:hover { color: var(--danger-red); border-bottom-color: var(--danger-red); }

        /* --- 底部控制 --- */
        .bottom-controls { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; }
        .mini-upload-btn, .admin-entry-btn { font-size: 0.75rem; color: var(--sub-text); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 3px; cursor: pointer; transition: 0.3s; text-decoration: none; }
        .mini-upload-btn:hover, .admin-entry-btn:hover { border-color: rgba(255,255,255,0.3); color: #fff; }

        /* --- 后台管理遮罩层 --- */
        #admin-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 100; display: none; padding: 40px 7vw; overflow-y: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .editor-container { display: flex; flex-direction: column; gap: 15px; }
        input, textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 15px; border-radius: 4px; outline: none; }
        textarea { height: 400px; resize: vertical; font-family: 'JetBrains Mono', monospace; }
        .save-btn { background: var(--star-white); color: #000; padding: 12px; border-radius: 4px; text-align: center; font-weight: bold; margin-top: 10px; }

        /* 极简进度条 */
        .mini-progress { height: 1px; background: var(--accent-blue); width: 0; position: fixed; bottom: 0; left: 0; transition: width 0.3s; }
        footer { padding: 80px 0 40px; text-align: center; font-size: 0.6rem; color: var(--sub-text); letter-spacing: 2px; }
    </style>
</head>
<body>

    <header class="header-strip">
        <canvas id="particle-canvas"></canvas>
        <div class="header-content">
            <h1 class="name">Z.J.Y</h1>
            <span class="role">工程师后台管理系统</span>
        </div>
    </header>

    <main class="main-content" id="visitor-view">
        <div class="section-header"><h2>/ 文档存档</h2></div>
        <div class="item-list" id="article-list">
            <a href="#" class="article-row">
                <span class="article-title">Cloudflare R2 部署手册.md</span>
                <span style="font-size: 0.75rem; color: var(--sub-text);">2026.04.11</span>
            </a>
        </div>

        <div class="section-header"><h2>/ 文件传送站</h2></div>
        <div id="file-container">
            <div class="file-row">
                <div class="file-info">
                    <span class="file-icon">[DOC]</span>
                    <span class="file-name">同步日志.txt</span>
                </div>
                <div class="file-actions">
                    <span class="action-link" onclick="copyLink()">分享</span>
                    <span class="action-link" onclick="downloadFile()">下载</span>
                    <span class="action-link delete" onclick="deleteFile(this)">删除</span>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="admin-entry">
                <span class="admin-entry-btn" onclick="toggleAdmin(true)">管理后台</span>
            </div>
            <div class="upload-footer">
                <input type="file" id="file-input" style="display:none">
                <label for="file-input" class="mini-upload-btn">+ 上传文件</label>
            </div>
        </div>
    </main>

    <div id="admin-panel">
        <div class="admin-header">
            <h3>编辑管理中心 / EDITOR</h3>
            <span class="admin-entry-btn" onclick="toggleAdmin(false)">返回前台</span>
        </div>
        
        <div class="admin-grid">
            <div class="editor-container">
                <h4 style="color:var(--sub-text)">发布新文章</h4>
                <input type="text" id="post-title" placeholder="文章标题 (例如: RGV逻辑优化.md)">
                <textarea id="post-content" placeholder="在此输入 Markdown 或文本内容..."></textarea>
                <div class="save-btn" onclick="savePost()">发布并更新首页</div>
            </div>
            <div class="editor-container">
                <h4 style="color:var(--sub-text)">操作指南</h4>
                <p style="font-size: 0.8rem; color: var(--sub-text)">
                    1. 这里的删除和发布目前为【前端模拟】。<br>
                    2. 若要真正生效，请配合 GitHub Token 对接 API。<br>
                    3. 文件删除会立即从页面移除（重启刷新后恢复）。
                </p>
            </div>
        </div>
    </div>

    <div class="mini-progress" id="upload-progress"></div>

    <footer>
        <p>DEPLOAYED ON CLOUDFLARE PAGES // SYSTEM_STATUS: OPERATIONAL</p>
    </footer>

    <script>
        /* --- 1. 星空动画 --- */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const header = document.querySelector('.header-strip');
        function resize() { canvas.width = header.clientWidth; canvas.height = header.clientHeight; }
        window.addEventListener('resize', resize); resize();
        let particles = [];
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.2; this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.2; this.life = Math.random() * 150 + 100;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life--; if(this.life <= 0) this.reset(); }
            draw() { ctx.fillStyle = `rgba(255,255,255,${this.life/250})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<200; i++) particles.push(new Particle());
        function anim() { ctx.fillStyle = 'rgba(2, 2, 4, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(anim); }
        anim();

        /* --- 2. 管理页面切换 --- */
        function toggleAdmin(show) {
            document.getElementById('admin-panel').style.display = show ? 'block' : 'none';
            document.getElementById('visitor-view').style.display = show ? 'none' : 'block';
        }

        /* --- 3. 模拟网盘功能 --- */
        function deleteFile(btn) {
            if(confirm('确定要从传送站移除该文件吗？')) {
                btn.closest('.file-row').remove();
            }
        }

        function savePost() {
            const title = document.getElementById('post-title').value;
            if(!title) return alert('请输入标题');
            
            // 模拟发布：在前台列表中新增一项
            const list = document.getElementById('article-list');
            const row = document.createElement('a');
            row.className = 'article-row';
            row.href = "#";
            row.innerHTML = `<span class="article-title">${title}</span><span style="font-size: 0.75rem; color: var(--sub-text);">刚刚</span>`;
            list.prepend(row);
            
            alert('发布成功（模拟）！已更新至首页。');
            toggleAdmin(false);
            document.getElementById('post-title').value = "";
            document.getElementById('post-content').value = "";
        }

        // 文件上传模拟
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const prog = document.getElementById('upload-progress');
                prog.style.width = '100%';
                setTimeout(() => {
                    const row = document.createElement('div');
                    row.className = 'file-row';
                    row.innerHTML = `
                        <div class="file-info">
                            <span class="file-icon">[NEW]</span>
                            <span class="file-name">${file.name}</span>
                        </div>
                        <div class="file-actions">
                            <span class="action-link">分享</span>
                            <span class="action-link">下载</span>
                            <span class="action-link delete" onclick="deleteFile(this)">删除</span>
                        </div>`;
                    document.getElementById('file-container').prepend(row);
                    prog.style.width = '0%';
                }, 500);
            }
        });
    </script>
</body>
</html>
